spring.application.name=mcpdemo

spring.datasource.url=jdbc:mysql://localhost:3306/myjobsearch?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.h2.console.enabled=true
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect
spring.autoconfigure.exclude=org.springframework.ai.model.bedrock.cohere.autoconfigure.BedrockCohereEmbeddingAutoConfiguration

spring.ai.bedrock.converse.chat.enabled=true
spring.ai.bedrock.aws.region=ap-south-1
